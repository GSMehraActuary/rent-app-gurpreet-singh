<!DOCTYPE html>
<html>
<head>
    <title>Edit Tenant</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="p-4 bg-light">
    <div class="container" style="max-width: 500px;">
        <h3>Edit Tenant: {{ tenant.name }}</h3>
        
        <form method="POST" class="card p-4 mt-3 shadow-sm">
            <div class="mb-3">
                <label>Name:</label>
                <input type="text" name="name" class="form-control" value="{{ tenant.name }}">
            </div>
            
            <div class="mb-3">
                <label>Base Rent (₹):</label>
                <input type="number" name="base_rent" class="form-control" value="{{ tenant.base_rent }}">
            </div>

            <div class="mb-3">
                <label>Phone (91...):</label>
                <input type="text" name="phone" class="form-control" value="{{ tenant.phone }}">
            </div>

            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-success flex-grow-1">Update Info</button>
                <a href="/admin" class="btn btn-secondary">Cancel</a>
            </div>
        </form>
    </div>
</body>
</html>
