{% extends "base.html" %}

{% block title %}Edit Tenant — RentManager{% endblock %}

{% block content %}
    <div class="row justify-content-center">
        <div class="col-12 col-sm-10 col-md-7 col-lg-5">

            <!-- Page Header -->
            <div class="rm-page-header">
                <h1><i class="bi bi-pencil-square"></i> Edit Tenant</h1>
                <p>Updating details for <strong>{{ tenant.name }}</strong></p>
            </div>

            <!-- Form Card -->
            <form method="POST" class="rm-form-card">

                <div class="form-floating mb-3">
                    <input type="text" name="name" id="editName" class="form-control" value="{{ tenant.name }}">
                    <label for="editName">Full Name</label>
                </div>

                <div class="form-floating mb-3">
                    <input type="number" name="base_rent" id="editRent" class="form-control" value="{{ tenant.base_rent }}">
                    <label for="editRent">Base Rent (₹)</label>
                </div>

                <div class="form-floating mb-4">
                    <input type="text" name="phone" id="editPhone" class="form-control" value="{{ tenant.phone }}">
                    <label for="editPhone">Phone (91…)</label>
                </div>

                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-primary flex-grow-1">
                        <i class="bi bi-check-lg me-1"></i>Update Info
                    </button>
                    <a href="/admin" class="btn btn-outline-secondary">Cancel</a>
                </div>
            </form>
        </div>
    </div>
{% endblock %}
