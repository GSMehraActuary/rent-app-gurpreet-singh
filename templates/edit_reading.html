<!DOCTYPE html>
<html>
<head><title>Edit Reading</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="p-4 container" style="max-width:500px">
    <h3>Edit Reading ✏️</h3>
    <form method="POST" class="card p-3 mt-3">
        <label>Date:</label>
        <input type="date" name="reading_date" value="{{ reading.reading_date }}" class="form-control mb-3">
        
        <label>Reading Value:</label>
        <input type="number" name="reading_value" value="{{ reading.reading_value }}" class="form-control mb-3">
        
        <button type="submit" class="btn btn-primary">Update</button>
    </form>
</body></html>
