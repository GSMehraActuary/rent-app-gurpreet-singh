<!DOCTYPE html>
<html>
<head>
    <title>Tenant Meter Entry</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="p-4 bg-light">

    <div class="container" style="max-width: 500px;">
        <h2 class="mb-4 text-center">Electricity Entry ⚡</h2>

        <form action="/submit-reading" method="POST" class="card p-4 shadow-sm">
            
            <div class="mb-3">
                <label class="form-label">Select Tenant:</label>
                <select name="tenant_id" class="form-select" required>
                    {% for tenant in tenants %}
                        <option value="{{ tenant.id }}">{{ tenant.name }} ({{ tenant.address }})</option>
                    {% endfor %}
                </select>
            </div>

            <div class="mb-3">
                <label class="form-label">Reading Date:</label>
                <input type="date" name="reading_date" class="form-control" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Meter Reading (kWh):</label>
                <input type="number" name="reading_value" class="form-control" placeholder="e.g. 22150" required>
            </div>

            <button type="submit" class="btn btn-primary w-100">Save Reading</button>
        </form>
    </div>

</body>
</html>
