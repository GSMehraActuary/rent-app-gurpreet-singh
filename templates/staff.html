{% extends "base.html" %}

{% block title %}Meter Entry — RentManager{% endblock %}
{% block nav_staff %}active{% endblock %}

{% block content %}
    <div class="row justify-content-center">
        <div class="col-12 col-sm-10 col-md-7 col-lg-5">

            <!-- Page Header -->
            <div class="rm-page-header text-center">
                <h1 class="justify-content-center"><i class="bi bi-lightning-charge-fill"></i> Meter Entry</h1>
                <p>Record a new electricity meter reading</p>
            </div>

            <!-- Form Card -->
            <form action="/submit-reading" method="POST" class="rm-form-card">

                <div class="form-floating mb-3">
                    <select name="tenant_id" id="tenantSelect" class="form-select" required>
                        {% for tenant in tenants %}
                            <option value="{{ tenant.id }}">{{ tenant.name }} ({{ tenant.address }})</option>
                        {% endfor %}
                    </select>
                    <label for="tenantSelect"><i class="bi bi-person me-1"></i>Select Tenant</label>
                </div>

                <div class="form-floating mb-3">
                    <input type="date" name="reading_date" id="readingDate" class="form-control" required>
                    <label for="readingDate"><i class="bi bi-calendar3 me-1"></i>Reading Date</label>
                </div>

                <div class="form-floating mb-4">
                    <input type="number" name="reading_value" id="readingValue" class="form-control" placeholder="e.g. 22150" required>
                    <label for="readingValue"><i class="bi bi-speedometer2 me-1"></i>Meter Reading (kWh)</label>
                </div>

                <button type="submit" class="btn btn-primary w-100 py-2">
                    <i class="bi bi-check2-circle me-1"></i>Save Reading
                </button>
            </form>
        </div>
    </div>
{% endblock %}
