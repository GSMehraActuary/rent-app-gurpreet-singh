<!DOCTYPE html>
<html>
<head><title>Reading History</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="p-4">
    <h3>History for {{ tenant.name }} 📜</h3>
    <a href="/admin" class="btn btn-secondary mb-3">Back to Dashboard</a>
    
    <table class="table table-bordered">
        <thead class="table-light"><tr><th>Date</th><th>Reading (kWh)</th><th>Action</th></tr></thead>
        <tbody>
            {% for row in readings %}
            <tr>
                <td>{{ row.reading_date }}</td>
                <td>{{ row.reading_value }}</td>
                <td>
                    <a href="/edit-reading/{{ row.id }}" class="btn btn-sm btn-warning">Edit</a>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</body></html>
