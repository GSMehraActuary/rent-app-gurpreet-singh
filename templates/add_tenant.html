{% extends "base.html" %}

{% block title %}Add Tenant — RentManager{% endblock %}
{% block nav_add_tenant %}active{% endblock %}

{% block content %}
    <div class="row justify-content-center">
        <div class="col-12 col-sm-10 col-md-8 col-lg-6">

            <!-- Page Header -->
            <div class="rm-page-header">
                <h1><i class="bi bi-person-plus-fill"></i> Add New Tenant</h1>
                <p>Register a new tenant to the property</p>
            </div>

            <!-- Form Card -->
            <form method="POST" class="rm-form-card">

                <div class="form-floating mb-3">
                    <input type="text" name="name" id="tenantName" class="form-control" placeholder="Name" required>
                    <label for="tenantName">Full Name</label>
                </div>

                <div class="form-floating mb-3">
                    <input type="text" name="address" id="tenantAddress" class="form-control" placeholder="Address" required>
                    <label for="tenantAddress">Address (e.g. W-1442)</label>
                </div>

                <div class="row g-3 mb-3">
                    <div class="col-6">
                        <div class="form-floating">
                            <input type="text" name="floor" id="tenantFloor" class="form-control" placeholder="Floor">
                            <label for="tenantFloor">Floor</label>
                        </div>
                    </div>
                    <div class="col-6">
                        <div class="form-floating">
                            <input type="text" name="side" id="tenantSide" class="form-control" placeholder="Side">
                            <label for="tenantSide">Side</label>
                        </div>
                    </div>
                </div>

                <div class="form-floating mb-3">
                    <input type="number" name="base_rent" id="tenantRent" class="form-control" placeholder="Rent" required>
                    <label for="tenantRent">Base Rent (₹)</label>
                </div>

                <div class="form-floating mb-4">
                    <input type="text" name="phone" id="tenantPhone" class="form-control" placeholder="Phone">
                    <label for="tenantPhone">Phone (e.g. 91999…)</label>
                </div>

                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-primary flex-grow-1">
                        <i class="bi bi-plus-lg me-1"></i>Add Tenant
                    </button>
                    <a href="/admin" class="btn btn-outline-secondary">Cancel</a>
                </div>
            </form>
        </div>
    </div>
{% endblock %}
