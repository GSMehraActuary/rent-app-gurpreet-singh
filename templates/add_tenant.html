<!DOCTYPE html>
<html>
<head><title>Add Tenant</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="p-4 container" style="max-width:600px">
    <h3>Add New Tenant 🏠</h3>
    <form method="POST" class="card p-3 mt-3">
        <input name="name" placeholder="Name (e.g. Rahul)" class="form-control mb-2" required>
        <input name="address" placeholder="Address (e.g. W-1442)" class="form-control mb-2" required>
        <input name="floor" placeholder="Floor (e.g. 2nd)" class="form-control mb-2">
        <input name="side" placeholder="Side (e.g. Right)" class="form-control mb-2">
        <input name="base_rent" type="number" placeholder="Rent Amount" class="form-control mb-2" required>
        <input name="phone" placeholder="Phone (91999...)" class="form-control mb-2">
        <button type="submit" class="btn btn-success">Add Tenant</button>
        <a href="/admin" class="btn btn-secondary">Cancel</a>
    </form>
</body></html>
